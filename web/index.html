<!doctype html>

<html lang="fi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EVG Presentation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c8cff'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='white'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #f4f4f5; --bar: #ffffff; --line: #e4e4e7; --ink: #09090b; --dim: #71717a; --accent: #18181b;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13px/1.4 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden; overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }
  /* The toolbar is HTML: buttons, selects and the file input are the
     browser's own. Everything under it is one canvas drawn by EVG. */
  #bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 12px; background: var(--bar); border-bottom: 1px solid var(--line);
    min-height: 32px;
  }
  #bar .brand { font-weight: 600; margin-right: 6px; letter-spacing: .2px; }
  #bar .grow { flex: 1; }
  #bar label { color: var(--dim); display: inline-flex; align-items: center; gap: 4px; }
  #bar button, #bar select {
    background: #ffffff; color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 10px; font: inherit; cursor: pointer;
  }
  #bar button:hover, #bar select:hover { border-color: var(--accent); }
  #bar button.primary { background: var(--accent); border-color: var(--accent); color: #fafafa; font-weight: 600; }
  #bar .sepbar { width: 1px; height: 22px; background: var(--line); }
  #status { color: var(--dim); white-space: nowrap; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  #keys {
    position: absolute; top: 0; left: 0; width: 1px; height: 1px;
    padding: 0; border: 0; outline: none; opacity: 0; resize: none;
    overflow: hidden; white-space: pre; z-index: 1;
  }
  #hint {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    color: var(--dim); text-align: center; pointer-events: none;
  }
  #err {
    position: fixed; left: 12px; bottom: 12px; right: 12px; color: #dc2626;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    white-space: pre-wrap; pointer-events: none;
  }
  #toast {
    position: fixed; left: 50%; top: 56px; transform: translateX(-50%);
    background: #ffffff; color: var(--ink); border: 1px solid var(--accent); border-radius: 8px;
    padding: 8px 14px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 80vw;
  }
  #toast.on { opacity: 1; }
  body.presenting #bar { display: none; }
  /* The share dialog: which link, for whom. */
  #shareDlg {
    background: var(--bar); color: var(--ink); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; width: min(560px, calc(100vw - 32px)); box-sizing: border-box;
  }
  #shareDlg::backdrop { background: rgba(9, 9, 11, 0.35); }
  #shareDlg h2 { margin: 0 0 12px; font-size: 16px; }
  #shareDlg .opt { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  #shareDlg .opt b { display: block; margin-bottom: 2px; }
  #shareDlg .opt span { color: var(--dim); }
  #shareDlg .row { display: flex; gap: 8px; margin-top: 8px; }
  #shareDlg input {
    flex: 1; min-width: 0; background: var(--bg); color: var(--dim); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px; font: 12px ui-monospace, Menlo, monospace;
  }
  #shareDlg button {
    background: #ffffff; color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 12px; font: inherit; cursor: pointer;
  }
  #shareDlg button.primary { background: var(--accent); border-color: var(--accent); color: #fafafa; font-weight: 600; }
  #shareDlg .foot { display: flex; justify-content: space-between; align-items: center; color: var(--dim); gap: 10px; }
  /* A hint over the editor: what a value does and what else it can be. */
  #valHint {
    position: fixed; z-index: 30; display: none; max-width: 340px; box-sizing: border-box;
    background: var(--bar); color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font: 13px/1.4 system-ui, sans-serif; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.14);
  }
  #valHint.on { display: block; }
  #valHint .hd { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  #valHint .hd b { font-family: ui-monospace, monospace; font-weight: 600; }
  #valHint .hd span { color: var(--dim); font-family: ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #valHint .doc { color: var(--dim); margin-bottom: 8px; }
  #valHint .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  #valHint .chips + .chips { margin-top: 8px; }
  #valHint .lbl { color: var(--dim); font-size: 12px; margin: 8px 0 4px; }
  #valHint button {
    background: #ffffff; color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
    padding: 3px 9px; font: 12px ui-monospace, monospace; cursor: pointer;
  }
  #valHint button:hover { border-color: var(--accent); }
  #valHint button.cur { background: var(--accent); border-color: var(--accent); color: #fafafa; }
  #valHint button.del { font-family: system-ui, sans-serif; color: #dc2626; }
  #valHint .row { display: flex; align-items: center; gap: 8px; }
  #valHint input[type=range] { flex: 1; accent-color: var(--accent); }
  #valHint input[type=number], #valHint input[type=text] {
    width: 86px; background: #ffffff; color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
    padding: 3px 6px; font: 12px ui-monospace, monospace;
  }
  #valHint input[type=color] { width: 42px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
  #valHint .foot { display: flex; justify-content: flex-end; margin-top: 10px; }
  #valHint .props { display: flex; flex-direction: column; gap: 1px; max-height: 320px; overflow-y: auto; }
  #valHint .prop { display: flex; justify-content: space-between; gap: 12px; padding: 3px 6px; border-radius: 6px; cursor: pointer; font: 12px ui-monospace, monospace; }
  #valHint .prop:hover { background: #f4f4f5; }
  #valHint .prop .nm { color: #0550ae; }
  #valHint .prop .val { display: inline-flex; align-items: center; gap: 5px; color: #953800; }
  #valHint .prop .sw { width: 11px; height: 11px; border-radius: 3px; border: 1px solid var(--line); display: inline-block; }
  #valHint .pdoc { color: var(--dim); font-size: 12px; margin-top: 8px; min-height: 2.8em; border-top: 1px solid var(--line); padding-top: 6px; }
  #valHint .prop .add { color: var(--accent); font-family: system-ui, sans-serif; }
  /* The help panel: what the selected slide is made of, and the theme
     rules that draw it. It takes its width from the stage. */
  #help {
    position: fixed; right: 0; width: 380px; display: none; z-index: 20; box-sizing: border-box;
    background: var(--bar); color: var(--ink); border-left: 1px solid var(--line);
    font: 13px/1.45 system-ui, sans-serif; overflow-y: auto; padding: 0 14px 20px;
  }
  body.helpOpen #help { display: block; }
  body.helpOpen #stage { margin-right: 380px; }
  body.presenting #help, body.viewer #help { display: none; }
  body.presenting #stage, body.viewer #stage { margin-right: 0; }
  #help .top { position: sticky; top: 0; background: var(--bar); display: flex; align-items: center; gap: 8px; padding: 10px 0 8px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  #help .top b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #help .top button { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 6px; cursor: pointer; padding: 2px 8px; }
  #help .intro { color: var(--dim); margin: 6px 0 4px; }
  #help section { border-bottom: 1px solid var(--line); padding: 10px 0; }
  #help h3 { margin: 0 0 4px; font-size: 14px; }
  #help .syn { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
  #help .syn code { background: #ffffff; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; font: 12px ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; }
  #help .doc { color: var(--dim); margin: 4px 0; }
  #help .rule { margin-top: 8px; font-family: ui-monospace, monospace; font-size: 12px; }
  #help .rule .sel { color: #8250df; }
  #help .rule .sd { color: var(--dim); font-family: system-ui, sans-serif; margin-left: 6px; }
  #help .prop { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; margin: 3px 0 3px 14px;
    padding: 3px 6px; border-radius: 6px; cursor: pointer; }
  #help .prop:hover { background: #f4f4f5; }
  #help .prop .nm { color: #0550ae; }
  #help .prop .val { display: inline-flex; align-items: center; gap: 5px; color: #953800; }
  #help .prop .val.none { color: var(--dim); font-style: italic; font-family: system-ui, sans-serif; }
  #help .prop .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); display: inline-block; }
  #help .prop .pd { grid-column: 1 / 3; color: var(--dim); font-family: system-ui, sans-serif; font-size: 12px; }
  #help .attr { margin: 3px 0 3px 14px; font-family: ui-monospace, monospace; font-size: 12px; }
  #help .attr .pd { color: var(--dim); font-family: system-ui, sans-serif; }
  /* A shared presentation: the slides only, and a small bar that fades. */
  #viewBar {
    position: fixed; right: 16px; bottom: 16px; display: none; gap: 8px; z-index: 5;
    transition: opacity .4s;
  }
  body.viewer #viewBar { display: flex; }
  body.viewer.idle #viewBar { opacity: 0; pointer-events: none; }
  #viewBar button {
    width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line);
    background: rgba(18, 24, 51, 0.85); color: var(--ink); font-size: 18px; cursor: pointer;
  }
  body.viewer #c { cursor: default; }
  body.viewer.idle #c { cursor: none; }
  body.presenting #c { cursor: none; }
  @media (max-width: 700px) { #bar .wide { display: none; } }
</style>
</head>
<body>
<div id="bar">
  <span class="brand">EVG Presentation</span>
  <label class="wide">Esitys
    <select id="sample"></select>
  </label>
  <label>Teema
    <select id="theme">
      <optgroup label="Tummat">
        <option value="aurora">aurora</option>
        <option value="nebula">nebula</option>
        <option value="carbon">carbon</option>
        <option value="ember">ember</option>
        <option value="midnight">midnight</option>
      </optgroup>
      <optgroup label="Vaaleat">
        <option value="corporate">corporate</option>
        <option value="editorial">editorial</option>
      </optgroup>
      <option value="">dokumentin oma</option>
    </select>
  </label>
  <span class="sepbar"></span>
  <button id="play" title="Toista valitusta diasta (P)">▶ Toista</button>
  <button id="present" class="primary" title="Esitä koko ruudulla (F5). S = puhujanäkymä, A = automaattinen eteneminen, Esc = lopeta">⛶ Esitä</button>
  <span class="sepbar"></span>
  <button id="open" class="wide" title="Avaa .md-tiedosto">Avaa</button>
  <button id="save" class="wide" title="Tallenna Markdown">Tallenna .md</button>
  <button id="pdf">PDF</button>
  <button id="pptx">PPTX</button>
  <button id="share" title="Kopioi linkki, jonka osoitteeseen tämä Markdown on pakattu">🔗 Jaa</button>
  <button id="helpBtn" title="Mitä valitulla dialla on ja millä teeman CSS-säännöillä sitä muutetaan">? Ohje</button>
  <span class="grow"></span>
  <span id="status"></span>
</div>
<div id="stage">
  <canvas id="c" aria-label="Esityksen editori"></canvas>
  <textarea id="keys" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"
            aria-label="Markdown — kirjoita tähän"></textarea>
  <div id="hint">ladataan…</div>
</div>
<div id="viewBar" aria-label="Esityksen ohjaimet">
  <button id="vPrev" title="Edellinen (←)">◀</button>
  <button id="vNext" title="Seuraava (→, välilyönti)">▶</button>
  <button id="vFull" title="Koko näyttö">⛶</button>
</div>
<div id="valHint" role="dialog" aria-label="Arvon vaihtoehdot"></div>
<aside id="help" aria-label="Dian ohje"></aside>
<dialog id="shareDlg">
  <h2>Jaa esitys</h2>
  <div class="opt">
    <b>Esitys</b>
    <span>Avautuu suoraan esitystilaan, ilman editoria ja muokkausnappeja.</span>
    <div class="row"><input id="shareShow" readonly /><button class="primary" data-copy="shareShow">Kopioi</button></div>
  </div>
  <div class="opt">
    <b>Muokkaus</b>
    <span>Avautuu editoriin: vastaanottaja voi muokata omaa kopiotaan.</span>
    <div class="row"><input id="shareEdit" readonly /><button data-copy="shareEdit">Kopioi</button></div>
  </div>
  <div class="foot"><span id="shareNote"></span><button id="shareClose">Sulje</button></div>
</dialog>
<div id="err"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input id="filepick" type="file" accept=".md,.markdown,text/markdown,text/plain" hidden />
<script src="./pres_app.js?v=__BUILD__"></script>
<script type="module" src="./main.js?v=__BUILD__"></script>
</body>
</html>
