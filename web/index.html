<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="build" content="__BUILD__" />
<!-- /s/{id} is this page too (firebase.json): the files are at the root -->
<base href="/" />
<title>Sliqtly</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<style>
  :root {
    --bg: #f4f4f5; --bar: #ffffff; --line: #e4e4e7; --ink: #09090b; --dim: #71717a; --accent: #18181b;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13px/1.4 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden; overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }
  /* The toolbar is HTML: buttons, selects and the file input are the
     browser's own. Everything under it is one canvas drawn by EVG. */
  #bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 12px; background: var(--bar); border-bottom: 1px solid var(--line);
    min-height: 32px;
  }
  #bar .brand { font-weight: 600; margin-right: 6px; letter-spacing: .2px; }
  #bar .grow { flex: 1; }
  #bar label { color: var(--dim); display: inline-flex; align-items: center; gap: 4px; }
  #bar button, #bar select {
    background: #ffffff; color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 10px; font: inherit; cursor: pointer;
  }
  #bar button:hover, #bar select:hover { border-color: var(--accent); }
  #bar button.primary { background: var(--accent); border-color: var(--accent); color: #fafafa; font-weight: 600; }
  #bar .sepbar { width: 1px; height: 22px; background: var(--line); }
  #status { color: var(--dim); white-space: nowrap; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  #keys {
    position: absolute; top: 0; left: 0; width: 1px; height: 1px;
    padding: 0; border: 0; outline: none; opacity: 0; resize: none;
    overflow: hidden; white-space: pre; z-index: 1;
  }
  #hint {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    color: var(--dim); text-align: center; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    transition: opacity .25s;
  }
  #hint.done { opacity: 0; }
  /* the logo turns while the editor loads: a turn, then a breath */
  #hint .spinner { animation: spin 1.1s cubic-bezier(.6, 0, .3, 1) infinite; }
  @keyframes spin {
    0% { transform: perspective(300px) rotateY(0deg); }
    55%, 100% { transform: perspective(300px) rotateY(360deg); }
  }
  @media (prefers-reduced-motion: reduce) { #hint .spinner { animation: none; } }
  #err {
    position: fixed; left: 12px; bottom: 12px; right: 12px; color: #dc2626;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    white-space: pre-wrap; pointer-events: none;
  }
  body.presenting #bar { display: none; }
  /* The keyboard's place on the canvas: the mirrored controls (evg-a11y.js)
     are transparent and sit on the drawn ones, so their focus outline is the
     ring around what the canvas drew. */
  .evg-a11y :focus-visible { outline: 2px solid #2563eb !important; outline-offset: 2px; border-radius: 6px; }
  /* the bar is drawn on the canvas (PresToolbar); this one is what it presses */
  body.canvas-bar #bar { display: none; }
  /* Until the canvas is ready only "ladataan…" shows: the HTML bar would
     appear first and then give way to the one drawn on the canvas. */
  body.booting #bar { display: none; }
  /* A shared presentation: the slides only, and a small bar that fades. */
  #viewBar {
    position: fixed; right: 16px; bottom: 16px; display: none; gap: 8px; z-index: 5;
    transition: opacity .4s;
  }
  body.viewer #viewBar { display: flex; }
  body.viewer.idle #viewBar { opacity: 0; pointer-events: none; }
  #viewBar button {
    width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(24, 24, 27, 0.72); color: #fafafa; font-size: 18px; cursor: pointer;
  }
  body.viewer #c { cursor: default; }
  body.viewer.idle #c { cursor: none; }
  body.presenting #c { cursor: none; }
  @media (max-width: 700px) { #bar .wide { display: none; } }
</style>
<!-- The faces the first frame needs: fetched while pres_app.js loads, at the
     same URLs main.js asks for. -->
<link rel="preload" href="./fonts/OpenSans-Regular.ttf?v=__BUILD__" as="fetch" crossorigin />
<link rel="preload" href="./fonts/OpenSans-Bold.ttf?v=__BUILD__" as="fetch" crossorigin />
<link rel="preload" href="./fonts/OpenSans-Italic.ttf?v=__BUILD__" as="fetch" crossorigin />
<link rel="preload" href="./fonts/OpenSans-BoldItalic.ttf?v=__BUILD__" as="fetch" crossorigin />
<link rel="preload" href="./fonts/NotoSans-Regular.ttf?v=__BUILD__" as="fetch" crossorigin />
<link rel="preload" href="./fonts/NotoSans-Bold.ttf?v=__BUILD__" as="fetch" crossorigin />
</head>
<body class="booting">
<div id="bar">
  <span class="brand">Sliqtly</span>
  <label class="wide"><span data-i18n>Presentation</span>
    <select id="sample"></select>
  </label>
  <label><span data-i18n>Theme</span>
    <select id="theme">
      <optgroup label="Dark">
        <option value="aurora">aurora</option>
        <option value="nebula">nebula</option>
        <option value="carbon">carbon</option>
        <option value="ember">ember</option>
        <option value="midnight">midnight</option>
      </optgroup>
      <optgroup label="Light">
        <option value="corporate">corporate</option>
        <option value="editorial">editorial</option>
      </optgroup>
      <option value="" data-i18n>Document's own</option>
    </select>
  </label>
  <span class="sepbar"></span>
  <button id="play" title="Play from the selected slide (P)" data-i18n-title data-i18n>▶ Play</button>
  <button id="present" class="primary" title="Present full screen (F5). S = speaker view, A = auto-advance, Esc = stop" data-i18n-title data-i18n>⛶ Present</button>
  <span class="sepbar"></span>
  <button id="open" class="wide" title="Open a presentation, data or a picture" data-i18n-title data-i18n>Open</button>
  <button id="save" class="wide" title="Save as Markdown" data-i18n-title data-i18n>Save .md</button>
  <button id="pdf">PDF</button>
  <button id="pptx">PPTX</button>
  <button id="share" title="Copy a link with this Markdown packed into its address" data-i18n-title data-i18n>🔗 Share</button>
  <button id="helpBtn" title="What the selected slide contains and which theme CSS rules change it" data-i18n-title data-i18n>? Help</button>
  <button id="pro" data-canvas="accent" title="Sign in with Google" data-i18n-title>PRO</button>
  <select id="lang" aria-label="Language" data-i18n-aria></select>
  <span class="grow"></span>
  <span id="status"></span>
</div>
<div id="stage">
  <canvas id="c" aria-label="Presentation editor" data-i18n-aria></canvas>
  <textarea id="keys" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"
            aria-label="Markdown — type here" data-i18n-aria></textarea>
  <div id="hint"><img class="spinner" src="./favicon.svg" alt="" width="72" height="72" /><span data-i18n>loading…</span></div>
</div>
<div id="viewBar" aria-label="Presentation controls" data-i18n-aria>
  <button id="vPrev" title="Previous (←)" data-i18n-title>◀</button>
  <button id="vNext" title="Next (→, Space)" data-i18n-title>▶</button>
  <button id="vFull" title="Full screen" data-i18n-title>⛶</button>
</div>
<div id="err"></div>
<input id="filepick" type="file" multiple accept=".md,.markdown,.txt,text/markdown,text/plain,.xlsx,.csv,.tsv,.json,image/png,image/jpeg,image/gif,image/webp,image/svg+xml" hidden />
<input id="fileadd" type="file" multiple hidden />
<script src="./pres_app.js?v=__BUILD__"></script>
<script type="module" src="./main.js?v=__BUILD__"></script>
<script type="module" src="./sliqtly.js?v=__BUILD__"></script>
</body>
</html>
