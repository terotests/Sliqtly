<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<!-- sliqtly.com: the front page, and the public viewer at /s/{id}
     (firebase.json). A shared presentation's slides come laid out from the
     server (/api/view/{id}, mcp-go/rgr/View.rgr) and view.js paints them;
     the editor is not part of this build (scripts/build-view.mjs). The front
     page is two tiles, Sliqtly Slides (/slides, web/slides.html) and Sliqtly
     Games (/games), on ink with an acid green accent. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="build" content="__BUILD__" />
<meta name="fonts" content="__FONTS__" />
<base href="/" />
<title>Sliqtly: Slides and Games</title>
<meta name="description" content="Sliqtly Slides: slides your AI assistant makes through MCP. Sliqtly Games: phone games made with an AI assistant." />
<meta name="theme-color" content="#070708" />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<!-- a presentation (/s/{id}, or the link the assistant's preview gives in
     <meta name="sliqtly-link">) or the front page, decided before the first
     paint so neither flashes over the other -->
<script>
  (function () {
    var m = document.querySelector('meta[name="sliqtly-link"]');
    var h = m ? m.content : location.hash;
    if (/^\/s\//.test(location.pathname) || /(^#|&)(share|md)=/.test(h)) document.documentElement.classList.add("deck");
  })();
</script>
<style>
  :root {
    --accent: #c8ff3c; --accent-hi: #d8ff74;
    --ink: #070708; --paper: #eeeee8; --dim: #9a9ca3; --dimmer: #6c6e75;
    --line: rgba(255, 255, 255, .10); --line-2: rgba(255, 255, 255, .20);
    --grotesk: "Helvetica Neue", "Arial Nova", "Inter", Helvetica, Arial, sans-serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --wrap: 1240px; --pad: clamp(16px, 5vw, 60px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--ink); color: var(--paper); }
  body { font: 400 17px/1.6 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  html.deck, html.deck body { height: 100%; overflow: hidden; overscroll-behavior: none; background: #0b0f1f; }
  html.deck .home { display: none; }
  html:not(.deck) #c, html:not(.deck) #brandIntro, html:not(.deck) #viewBar, html:not(.deck) #picWait { display: none !important; }

  /* ------------------------------------------------ the front page ---- */
  /* two tiles, Slides and Games: a picture and a name each (the pictures
     in web/home/); Slides' own page is web/slides.html */
  .home { min-height: 100vh; display: flex; flex-direction: column; }
  .home a { color: inherit; text-decoration: none; }
  .home :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .top { display: flex; align-items: center; gap: 10px; padding: 20px var(--pad); font: 700 18px/1 var(--grotesk); }
  .top img { width: 26px; height: 26px; }
  .tiles { flex: 1; width: 100%; max-width: var(--wrap); margin-inline: auto; padding: clamp(8px, 3vw, 40px) var(--pad) clamp(32px, 5vw, 64px);
    display: grid; gap: clamp(20px, 3vw, 40px); grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); align-content: center; }
  .tile { display: block; border: 1px solid var(--line-2); border-radius: 18px; overflow: hidden; background: #101116;
    transition: border-color .2s, transform .2s; }
  .tile:hover { border-color: var(--accent); transform: translateY(-3px); }
  /* a background, not an <img>: a shared deck's page (and the assistant's
     preview, which inlines every <img>) never loads the pictures */
  .tile .pic { display: block; width: 100%; aspect-ratio: 8 / 5; background: #14183a center / cover no-repeat; }
  .tile__name { display: flex; align-items: center; gap: 12px; padding: 20px 24px 6px; font: 800 clamp(26px, 3vw, 36px)/1.1 var(--grotesk); letter-spacing: -.02em; }
  .tile__name .icon { flex: none; width: 36px; height: 36px; border-radius: 8px; background: center / contain no-repeat; }
  .tile__name .go { margin-left: auto; color: var(--accent); font-weight: 400; transition: transform .2s; }
  .tile:hover .go { transform: translateX(4px); }
  .tile__line { margin: 0; padding: 0 24px 22px; color: var(--dim); font-size: 16px; }
  @media (prefers-reduced-motion: reduce) { .tile, .tile .go { transition: none; } .tile:hover { transform: none; } }
  .foot { display: flex; flex-wrap: wrap; gap: 8px 22px; justify-content: center; padding: 0 var(--pad) 32px; font: 13px/1.6 var(--mono); }
  .foot a { color: var(--dimmer); }
  .foot a:hover { color: var(--accent); }

  /* --------------------------------------------------- a presentation ---- */
  #c { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: default; }
  body.idle #c { cursor: none; }
  /* a realistic book (web/bookgl.js) over the slide's canvas, which takes the presses */
  #bookSheet { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
  /* Sliqtly's logo and name: the screen while the slides load, and the
     intro every shared presentation opens with (web/brand.js) */
  #brandIntro {
    position: fixed; inset: 0; z-index: 30; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(10px, 2.5vmin, 24px); color: #fafafa; font-family: "Open Sans", system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% 45%, #1a2147 0%, #0b0f1f 70%);
    transition: opacity .35s;
  }
  #brandIntro[hidden] { display: none; }
  #brandIntro.out { opacity: 0; pointer-events: none; }
  #brandIntro .logo { width: clamp(96px, 24vmin, 220px); height: auto; animation: introTurn 1.2s cubic-bezier(.5, 0, .25, 1) both; }
  #brandIntro .name { font-size: clamp(48px, 13vmin, 150px); font-weight: 700; letter-spacing: .01em; line-height: 1; animation: introRise .6s .55s ease-out both; }
  #brandIntro .site { font-size: clamp(15px, 2.6vmin, 26px); opacity: .7; animation: introRise .6s .8s ease-out both; }
  #brandIntro .note { max-width: min(520px, calc(100vw - 32px)); text-align: center; font-size: 15px; opacity: .85; }
  #brandIntro .note:empty { display: none; }
  #brandIntro .note a { color: #93c5fd; }
  #brandIntro .note button { margin-top: 14px; height: 40px; padding: 0 18px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.3);
    background: rgba(24, 24, 27, 0.72); color: #fafafa; font: 15px/1 "Open Sans", system-ui, sans-serif; cursor: pointer; }
  #brandIntro .note button:hover { border-color: #fafafa; }
  /* still loading when the intro is over: a bar running under the name */
  #brandIntro .load { width: min(220px, 50vw); height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.14); overflow: hidden; visibility: hidden; }
  #brandIntro.loading .load { visibility: visible; }
  #brandIntro .load::before { content: ""; display: block; width: 40%; height: 100%; border-radius: 2px; background: #fafafa; animation: loadRun 1.1s ease-in-out infinite; }
  @keyframes loadRun { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  /* a slide shown while its pictures are still on their way */
  #picWait { position: fixed; top: 14px; right: 14px; z-index: 6; width: 22px; height: 22px; border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.25); border-top-color: #fafafa; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
    animation: picSpin .8s linear infinite; pointer-events: none; }
  #picWait[hidden] { display: none; }
  @keyframes picSpin { to { transform: rotate(360deg); } }
  @keyframes introTurn {
    0% { transform: perspective(600px) scale(.4) rotateY(0deg); opacity: 0; }
    25% { opacity: 1; }
    100% { transform: perspective(600px) scale(1) rotateY(360deg); opacity: 1; }
  }
  @keyframes introRise { from { transform: translateY(18px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    #brandIntro .logo, #brandIntro .name, #brandIntro .site { animation: none; }
    #brandIntro .load::before { animation-duration: 3s; }
    #picWait { animation-duration: 3s; }
  }
  /* the way round the slides: a small bar that fades when nothing moves */
  #viewBar { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; z-index: 5; transition: opacity .4s; }
  #viewBar[hidden] { display: none; }
  body.idle #viewBar { opacity: 0; pointer-events: none; }
  /* a game on the slide has the keyboard and takes the stage (Esc gives it back) */
  body.game-stage #viewBar { opacity: 0; pointer-events: none; }
  #viewBar > button, #viewBar > input {
    height: 44px; min-width: 44px; border-radius: 22px; border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(24, 24, 27, 0.72); color: #fafafa; font-size: 18px; cursor: pointer;
  }
  #viewBar > #vCount, #viewBar > #vGo {
    padding: 0 14px; font: 15px/1 "Open Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  #viewBar > #vGo { width: 88px; text-align: center; border-color: #60a5fa; cursor: text; }
  #viewBar > [hidden] { display: none; }
  #viewBar > #vExport { padding: 0 16px; font: 15px/1 "Open Sans", system-ui, sans-serif; white-space: nowrap; }
  #viewBar > #vShare { padding: 0 16px; font: 15px/1 "Open Sans", system-ui, sans-serif; white-space: nowrap; }
  #viewBar > #vShare .icon { display: none; font-size: 18px; }
  /* a phone's bar has room for the share mark only, and none for ⏮ (the
     count goes to any slide) */
  @media (max-width: 560px) {
    #viewBar > #vFirst { display: none; }
    #viewBar > #vShare { padding: 0; }
    #viewBar > #vShare .icon { display: inline; }
    #viewBar > #vShare .lbl { display: none; }
  }
  #viewBar > #vExport[aria-busy="true"] { cursor: progress; opacity: .8; }
  /* the formats, above the bar at its right end */
  #vMenu { position: absolute; right: 0; bottom: 52px; min-width: 200px; padding: 6px; display: flex; flex-direction: column; gap: 2px;
    border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(24, 24, 27, 0.92); }
  #vMenu[hidden] { display: none; }
  #vMenu button { display: flex; justify-content: space-between; gap: 16px; padding: 10px 12px; border: 0; border-radius: 9px;
    background: transparent; color: #fafafa; font: 15px/1.2 "Open Sans", system-ui, sans-serif; text-align: left; cursor: pointer; }
  #vMenu button span { color: #a1a1aa; }
  #vMenu #vCopyMd { margin-top: 4px; border-top: 1px solid rgba(255, 255, 255, 0.12); border-radius: 0 0 9px 9px; }
  #vMenu button:hover, #vMenu button:focus-visible { background: rgba(255, 255, 255, 0.12); outline: none; }
</style>
</head>
<body>
<div class="home">
  <header class="top"><img src="./favicon.svg" alt="" width="26" height="26" />Sliqtly</header>
  <main class="tiles">
    <a class="tile" href="/slides">
      <span class="pic" role="img" aria-label="Slides made with Sliqtly: a line chart, a donut chart and process steps" style="background-image: url(/home/slides.jpg)"></span>
      <span class="tile__name"><span class="icon" style="background-image: url(/favicon.svg)"></span>Sliqtly Slides<span class="go" aria-hidden="true">→</span></span>
      <p class="tile__line">Slides your AI assistant makes, edits and exports through MCP.</p>
    </a>
    <a class="tile" href="/games">
      <span class="pic" role="img" aria-label="Sliqtly games on a phone: a prism experiment, four in a row and house building" style="background-image: url(/home/games.jpg)"></span>
      <span class="tile__name"><span class="icon" style="background-image: url(/home/games-icon.svg)"></span>Sliqtly Games<span class="go" aria-hidden="true">→</span></span>
      <p class="tile__line">Phone games, made with an AI assistant.</p>
    </a>
  </main>
  <footer class="foot"><a href="/connect.html">Connect via MCP</a><a href="/local.html">Run it locally</a><a href="https://buymeacoffee.com/sliqtly" target="_blank" rel="noopener">Buy me a coffee ☕</a></footer>
</div>


<canvas id="c" aria-label="Presentation"></canvas>
<div id="brandIntro" role="img" aria-label="Sliqtly"><img class="logo" src="./favicon.svg" alt="" width="220" height="220" /><span class="name">Sliqtly</span><span class="site">sliqtly.com</span><span class="load" aria-hidden="true"></span><span id="note" class="note" role="status"></span></div>
<div id="picWait" role="status" aria-label="Loading pictures" hidden></div>
<script>window.__introAt = performance.now();</script>
<div id="viewBar" aria-label="Presentation controls" hidden>
  <button id="vFirst" title="First slide (Home)">⏮&#xFE0E;</button>
  <button id="vPrev" title="Previous (←)">◀</button>
  <button id="vNext" title="Next (→, Space)">▶</button>
  <button id="vCount" title="Go to slide… (type the number and Enter)" aria-live="polite">1 / 1</button>
  <input id="vGo" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Slide number" hidden />
  <button id="vFull" title="Full screen">⛶</button>
  <button id="vShare" title="Share this slide (copies its link)" aria-label="Share slide"><span class="icon" aria-hidden="true">⤴&#xFE0E;</span><span class="lbl">Share slide</span></button>
  <button id="vExport" title="Download the presentation" aria-haspopup="menu" aria-expanded="false" aria-controls="vMenu">Export ▾</button>
  <div id="vMenu" role="menu" aria-label="Download as" hidden>
    <button role="menuitem" data-format="pdf">PDF <span>.pdf</span></button>
    <button role="menuitem" data-format="pptx">PowerPoint <span>.pptx</span></button>
    <button role="menuitem" data-format="md">Markdown <span>.md</span></button>
    <button role="menuitem" id="vImage">Image of this slide <span>.png</span></button>
    <button role="menuitem" id="vCopyMd">Copy Markdown <span>⧉</span></button>
    <button role="menuitem" id="vCopyImg">Copy image <span>⧉</span></button>
  </div>
</div>
<script type="module" src="./view.js?v=__BUILD__"></script>
</body>
</html>
