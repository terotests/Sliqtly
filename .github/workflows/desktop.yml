# Sliqtly, native (desktop/): the editor (src/PresApp.rgr + EVGUI) compiled
# to C++ in an SDL2 + OpenGL window, built and checked headless on Linux and
# macOS; the macOS job uploads the zipped Sliqtly.app. The Linux job also
# builds and checks the first editor (src/EditorApp.rgr, `old:*` scripts)
# against desktop/test/mock-server.mjs. Deploys nothing.
name: Desktop editor

on:
  push:
    paths: ["desktop/**", "src/**", "presentation.config.json", "scripts/lib.mjs", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "src/**", "presentation.config.json", "scripts/lib.mjs", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SDL2, OpenGL (Mesa), libcurl, Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev libgl-dev libgl1-mesa-dri libcurl4-openssl-dev xvfb
      - name: Git access to RangerFlow, RangerMarkdown and RangerPPTX
        working-directory: .
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: sh scripts/ci-git-auth.sh
      - run: npm ci --no-audit --no-fund
      - name: EVG (ranger.json, pinned)
        run: npm run deps
      - name: Native build (the editor)
        run: npm run native
      - name: Native check (headless)
        run: npm run native:check
      - name: The first editor, unit tests (models, mock server, screens)
        run: npm test
      - name: The first editor, web build
        run: npm run old:web:build
      - name: The first editor, native build
        run: npm run old:native
      - name: The first editor, native check (headless, screenshots)
        run: npm run old:native:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sliqtly-native-linux-shots
          path: |
            desktop/native/build-editor/shots/
            desktop/native/build/shots/
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest
    env:
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SDL2 (the official framework, universal, for macOS 11 and later)
        env:
          SDL_VERSION: "2.32.10"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/SDL2.dmg" "https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/SDL2-$SDL_VERSION.dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/sdl" "$RUNNER_TEMP/SDL2.dmg"
          mkdir -p "$RUNNER_TEMP/fw"
          ditto "$RUNNER_TEMP/sdl/SDL2.framework" "$RUNNER_TEMP/fw/SDL2.framework"
          hdiutil detach "$RUNNER_TEMP/sdl"
          echo "SDL2_FRAMEWORK=$RUNNER_TEMP/fw/SDL2.framework" >> "$GITHUB_ENV"
          echo "UNIVERSAL=1" >> "$GITHUB_ENV"
      - name: Git access to RangerFlow, RangerMarkdown and RangerPPTX
        working-directory: .
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: sh scripts/ci-git-auth.sh
      - run: npm ci --no-audit --no-fund
      - name: EVG (ranger.json, pinned)
        run: npm run deps
      - name: Native build (and Sliqtly.app)
        run: npm run native
      - name: Check the bundle
        run: |
          APP="native/build-editor/Sliqtly.app"
          plutil -lint "$APP/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist")" = com.sliqtly.app
          test -x "$APP/Contents/MacOS/sliqtly"
          test -s "$APP/Contents/Resources/AppIcon.icns"
          test -s "$APP/Contents/Resources/editor-res/pres.css"
          test -s "$APP/Contents/Resources/editor-res/fonts/OpenSans-Regular.ttf"
      - name: Check it opens on older macOS (minimum 11.0, both CPUs, nothing from Homebrew)
        run: |
          APP="native/build-editor/Sliqtly.app"
          BIN="$APP/Contents/MacOS/sliqtly"
          lipo -archs "$BIN" | grep -q arm64
          lipo -archs "$BIN" | grep -q x86_64
          for a in arm64 x86_64; do
            otool -arch $a -l "$BIN" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}' | grep -qx "11.0"
          done
          if otool -L "$BIN" | grep -E "/opt/homebrew|/usr/local"; then echo "links to Homebrew"; exit 1; fi
          otool -L "$BIN" | grep -q "@rpath/SDL2.framework"
          test -d "$APP/Contents/Frameworks/SDL2.framework"
          codesign --verify --deep --strict "$APP"
      - name: Zip the app
        run: ditto -c -k --sequesterRsrc --keepParent "native/build-editor/Sliqtly.app" "native/build-editor/Sliqtly-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Sliqtly-macOS
          path: desktop/native/build-editor/Sliqtly-macOS.zip
      - name: Native check (headless)
        run: npm run native:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sliqtly-native-macos-shots
          path: desktop/native/build-editor/shots/
          if-no-files-found: ignore
