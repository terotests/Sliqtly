# Deploys the MCP server (mcp/) as the Cloud Function `mcp` (2nd gen,
# europe-west1) in project `sliqtly`. Run by hand: Actions → Deploy MCP →
# Run workflow. The page's own Deploy workflow does not touch it.
#
# The FIREBASE_SERVICE_ACCOUNT secret's account needs, besides what Deploy
# needs: Cloud Functions Admin, Service Account User, Cloud Build Editor,
# Artifact Registry Administrator and Cloud Run Admin (a first deploy also
# enables the Cloud Functions, Cloud Build, Artifact Registry, Cloud Run
# and Eventarc APIs, which needs Service Usage Admin, or enable them once
# in the console).
name: Deploy MCP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mcp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Deploy the function
        working-directory: .
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx --yes firebase-tools@14 deploy --only functions:mcp --project sliqtly --non-interactive --force
