# Builds the server package (mcp-go/packaging/build-deb.sh: the binary with
# the editor and player built in) for amd64 and arm64, and puts the two .deb
# files in the project's Storage bucket under downloads/, each with a new
# random download token. The links, which work only with the token, are in
# the run's summary: Actions → Server package → the run.
#
#   curl -fLo sliqtly-server.deb '<link>' && sudo apt install ./sliqtly-server.deb
#
# The version counts up by itself: the last one is the newest tag
# server-v<version>, and a run adds 1 to its last number (0.1.4 → 0.1.5), or
# to the middle or first one when "bump" asks for minor or major (0.2.0,
# 1.0.0). "version" names one instead. The run tags the commit it built.
#
# A new run replaces the latest_ files and their tokens: older latest_
# links stop working; a versioned file keeps its own link.
# The FIREBASE_SERVICE_ACCOUNT secret's account needs Storage Object Admin
# (or Firebase Storage Admin) on the bucket.
name: Server package

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which number goes up"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Or this version exactly (e.g. 1.0.0); empty: counted"
        required: false
        default: ""

permissions:
  contents: write # the server-v<version> tag

concurrency:
  group: server-package
  cancel-in-progress: false

env:
  PROJECT: sliqtly
  BUCKET: sliqtly.firebasestorage.app

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, to count from
      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          GIVEN: ${{ inputs.version }}
        run: |
          # before the first tag: 0.1.1 (0.1.0 and 0.1.1 went out by hand)
          last=$(git tag --list 'server-v*' | sed 's/^server-v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          last=${last:-0.1.1}
          if [ -n "$GIVEN" ]; then
            next=$GIVEN
          else
            IFS=. read -r major minor patch <<< "$last"
            case "$BUMP" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              *) next="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          if git rev-parse -q --verify "refs/tags/server-v$next" >/dev/null; then
            echo "server-v$next exists already" >&2
            exit 1
          fi
          echo "after $last: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp-go/go.mod
          cache-dependency-path: mcp-go/go.sum
      - name: Check the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([~+.-][A-Za-z0-9.~+-]+)?$'
      - name: Build the editor and player
        run: npm ci --no-audit --no-fund && node scripts/build.mjs
      - name: Generate and test the server
        working-directory: mcp-go
        run: go generate ./... && go test ./...
      - name: Build the packages
        working-directory: mcp-go
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          packaging/build-deb.sh "$VERSION" amd64
          packaging/build-deb.sh "$VERSION" arm64
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Upload with download tokens
        working-directory: mcp-go
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          links=$(mktemp)
          for f in dist/*.deb; do
            name=$(basename "$f")
            arch=${name##*_}; arch=${arch%.deb}
            token=$(cat /proc/sys/kernel/random/uuid)
            for obj in "downloads/$name" "downloads/sliqtly-server_latest_${arch}.deb"; do
              gcloud storage cp "$f" "gs://$BUCKET/$obj" \
                --content-type=application/vnd.debian.binary-package \
                --custom-metadata="firebaseStorageDownloadTokens=$token" --quiet
              url="https://firebasestorage.googleapis.com/v0/b/$BUCKET/o/$(printf %s "$obj" | sed 's#/#%2F#g')?alt=media&token=$token"
              echo "- \`$obj\` ($(sha256sum "$f" | cut -c1-16)…): $url" >> "$links"
              case "$obj" in *_latest_*) printf '%s' "$url" > "latest_$arch.url" ;; esac
            done
          done
          # one line to install or update on Ubuntu: download, install (the
          # package restarts a running service itself), restart, show it
          install() {
            printf "curl -fLo /tmp/sliqtly-server.deb '%s' && sudo apt install -y /tmp/sliqtly-server.deb && sudo systemctl restart sliqtly && systemctl --no-pager status sliqtly | head -n 3" "$(cat "latest_$1.url")"
          }
          {
            echo "## sliqtly-server $VERSION"
            echo
            echo "Each link works only with its token; do not post it where others read."
            echo
            echo "### Install or update on Ubuntu, Intel/AMD (amd64)"
            echo
            echo '```sh'
            install amd64
            echo
            echo '```'
            echo
            echo "### ARM (arm64)"
            echo
            echo '```sh'
            install arm64
            echo
            echo '```'
            echo
            echo "### Files"
            echo
            cat "$links"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Install or update on Ubuntu (amd64):"
          install amd64
          echo
      - name: Tag the commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "server-v$VERSION" "$GITHUB_SHA"
          git push origin "server-v$VERSION"
