# Builds the server package (mcp-go/packaging/build-deb.sh: the binary with
# the editor and player built in) for amd64 and arm64, and for Windows the
# .msi (amd64) and the .zip (amd64, arm64) (mcp-go/packaging/windows/), and
# puts them in the project's Storage bucket under downloads/, each with a
# new random download token. The .msi is installed, used and removed on
# Windows before anything is put there. The links, which work only with the
# token, are in the run's summary: Actions → Server package → the run.
#
#   curl -fLo sliqtly-server.deb '<link>' && sudo apt install ./sliqtly-server.deb
#
# The version counts up by itself: the last one is the newest tag
# server-v<version>, and a run adds 1 to its last number (0.1.4 → 0.1.5), or
# to the middle or first one when "bump" asks for minor or major (0.2.0,
# 1.0.0). "version" names one instead. The run tags the commit it built.
#
# A new run replaces the latest_ files and their tokens: older latest_
# links stop working; a versioned file keeps its own link.
# The FIREBASE_SERVICE_ACCOUNT secret's account needs Storage Object Admin
# (or Firebase Storage Admin) on the bucket.
name: Server package

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which number goes up"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Or this version exactly (e.g. 1.0.0); empty: counted"
        required: false
        default: ""

permissions:
  contents: write # the server-v<version> tag

concurrency:
  group: server-package
  cancel-in-progress: false

env:
  PROJECT: sliqtly
  BUCKET: sliqtly.firebasestorage.app

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, to count from
      - name: Git access to RangerFlow, RangerMarkdown and RangerPPTX
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: sh scripts/ci-git-auth.sh
      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          GIVEN: ${{ inputs.version }}
        run: |
          # before the first tag: 0.1.1 (0.1.0 and 0.1.1 went out by hand)
          last=$(git tag --list 'server-v*' | sed 's/^server-v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          last=${last:-0.1.1}
          if [ -n "$GIVEN" ]; then
            next=$GIVEN
          else
            IFS=. read -r major minor patch <<< "$last"
            case "$BUMP" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              *) next="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          if git rev-parse -q --verify "refs/tags/server-v$next" >/dev/null; then
            echo "server-v$next exists already" >&2
            exit 1
          fi
          echo "after $last: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp-go/go.mod
          cache-dependency-path: mcp-go/go.sum
      - name: Check the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([~+.-][A-Za-z0-9.~+-]+)?$'
      # programs on slides (```app): CErXes built to WebAssembly
      - name: Rust's WebAssembly target
        run: rustup target add wasm32-wasip1
      - name: Build the editor and player
        run: npm ci --no-audit --no-fund && node scripts/build.mjs
      - name: Generate and test the server
        working-directory: mcp-go
        run: go generate ./... && go test ./...
      - name: Build the packages
        working-directory: mcp-go
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          packaging/build-deb.sh "$VERSION" amd64
          packaging/build-deb.sh "$VERSION" arm64
          packaging/windows/build-windows.sh "$VERSION" amd64
          packaging/windows/build-windows.sh "$VERSION" arm64
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            mcp-go/dist/*.deb
            mcp-go/dist/*.zip
            mcp-go/dist/windows_amd64/sliqtly-server.exe
          retention-days: 3
  # the .msi, made and tried on Windows: installed, used, upgraded, removed
  msi:
    needs: package
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: mcp-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: mcp-go/dist
      - name: Build the .msi
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          ./packaging/windows/build-msi.ps1 -Version $env:VERSION -Exe dist/windows_amd64/sliqtly-server.exe
          # the same program as a newer version, for the upgrade test only
          ./packaging/windows/build-msi.ps1 -Version 255.0.0 -Exe dist/windows_amd64/sliqtly-server.exe -Out upgrade-test
      - name: Install, use, upgrade and remove
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: ./packaging/windows/smoke-test.ps1 -Msi "dist/sliqtly-server_${env:VERSION}_windows_amd64.msi" -Upgrade upgrade-test/sliqtly-server_255.0.0_windows_amd64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: mcp-go/dist/*.msi
          retention-days: 3
  publish:
    needs: [package, msi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: mcp-go/dist
      - uses: actions/download-artifact@v4
        with:
          name: msi
          path: mcp-go/dist
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Upload with download tokens
        working-directory: mcp-go
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          links=$(mktemp)
          for f in dist/*.deb dist/*.msi dist/*.zip; do
            name=$(basename "$f")
            ext=${name##*.}
            # sliqtly-server_<version>_<arch>.deb, …_windows_<arch>.msi|.zip
            arch=${name%.*}; arch=${arch##*_}
            case "$name" in
              *_windows_*) latest="sliqtly-server_latest_windows_${arch}.$ext"; key="windows_${arch}_$ext" ;;
              *) latest="sliqtly-server_latest_${arch}.$ext"; key=$arch ;;
            esac
            case "$ext" in
              deb) type=application/vnd.debian.binary-package ;;
              msi) type=application/x-msi ;;
              *) type=application/zip ;;
            esac
            token=$(cat /proc/sys/kernel/random/uuid)
            for obj in "downloads/$name" "downloads/$latest"; do
              gcloud storage cp "$f" "gs://$BUCKET/$obj" \
                --content-type="$type" \
                --custom-metadata="firebaseStorageDownloadTokens=$token" --quiet
              url="https://firebasestorage.googleapis.com/v0/b/$BUCKET/o/$(printf %s "$obj" | sed 's#/#%2F#g')?alt=media&token=$token"
              echo "- \`$obj\` ($(sha256sum "$f" | cut -c1-16)…): $url" >> "$links"
              case "$obj" in *_latest_*) printf '%s' "$url" > "latest_$key.url" ;; esac
            done
          done
          # one line to install or update on Ubuntu: download, install (the
          # package restarts a running service itself), restart, show it
          install() {
            printf "curl -fLo /tmp/sliqtly-server.deb '%s' && sudo apt install -y /tmp/sliqtly-server.deb && sudo systemctl restart sliqtly && systemctl --no-pager status sliqtly | head -n 3" "$(cat "latest_$1.url")"
          }
          # Windows: download the .msi, install or upgrade it (the service
          # starts itself), show the service
          windows() {
            printf 'Invoke-WebRequest '"'"'%s'"'"' -OutFile "$env:TEMP\\sliqtly-server.msi"; Start-Process msiexec -Verb RunAs -Wait -ArgumentList "/i `"$env:TEMP\\sliqtly-server.msi`" /passive"; Get-Service Sliqtly' "$(cat latest_windows_amd64_msi.url)"
          }
          {
            echo "## sliqtly-server $VERSION"
            echo
            echo "Each link works only with its token; do not post it where others read."
            echo
            echo "### Install or update on Ubuntu, Intel/AMD (amd64)"
            echo
            echo '```sh'
            install amd64
            echo
            echo '```'
            echo
            echo "### ARM (arm64)"
            echo
            echo '```sh'
            install arm64
            echo
            echo '```'
            echo
            echo "### Install or update on Windows (PowerShell; asks for administrator rights)"
            echo
            echo '```powershell'
            windows
            echo
            echo '```'
            echo
            echo "### Files"
            echo
            cat "$links"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Install or update on Ubuntu (amd64):"
          install amd64
          echo
      - name: Tag the commit
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          git tag "server-v$VERSION" "$GITHUB_SHA"
          git push origin "server-v$VERSION"
