# The server package for Windows on a change to it: the .exe and .zip built
# on Linux (mcp-go/packaging/windows/build-windows.sh), the server's tests
# run on Windows, the .msi built there with WiX (build-msi.ps1), installed,
# used, upgraded and removed (smoke-test.ps1). Publishes nothing: Actions →
# Server package does, with the .deb files.
name: Windows package

on:
  pull_request:
    paths: ["mcp-go/packaging/windows/**", "mcp-go/*windows*.go", "mcp-go/service*.go", "mcp-go/envfile.go", "mcp-go/ifkind*.go", "mcp-go/diskfree*.go", "mcp-go/lock*.go", "mcp-go/main.go", ".github/workflows/windows-package.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v4
      - name: Git access to RangerFlow, RangerMarkdown and RangerPPTX
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: sh scripts/ci-git-auth.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp-go/go.mod
          cache-dependency-path: mcp-go/go.sum
      - name: Rust's WebAssembly target
        run: rustup target add wasm32-wasip1
      - name: Build the editor and player
        run: npm ci --no-audit --no-fund && node scripts/build.mjs
      - name: Generate the server
        working-directory: mcp-go
        run: go generate ./...
      - name: Vet for Windows
        working-directory: mcp-go
        run: GOOS=windows go vet -tags nocloud -structtag=false -assign=false ./...
      - name: Build the .exe and .zip
        working-directory: mcp-go
        run: packaging/windows/build-windows.sh 0.0.1 amd64
      # the server's tests as a Windows program, run on Windows below from
      # mcp-go, where their testdata is
      - name: Build the tests for Windows
        working-directory: mcp-go
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -c -tags nocloud -o dist/windows_amd64/server-test.exe .
      # what the tests read that is built, not committed: themes, fonts,
      # the built web app (mcp-go/webdist, web/dist)
      - name: The tests' built files
        run: |
          git ls-files --others --ignored --exclude-standard mcp-go web/dist \
            | grep -v -e '\.go$' -e '^mcp-go/\.' -e '^mcp-go/dist/' > built-files.txt
          tar -czf mcp-go/dist/windows_amd64/built-files.tgz -T built-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            mcp-go/dist/windows_amd64/
            mcp-go/dist/*.zip
          retention-days: 3
  tests:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: mcp-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: mcp-go/dist
      - name: The server's tests on Windows
        run: |
          tar -xzf dist/windows_amd64/built-files.tgz -C ..
          ./dist/windows_amd64/server-test.exe "-test.timeout=20m"
  msi:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: mcp-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: mcp-go/dist
      - name: Build the .msi (and a newer one, for the upgrade)
        run: |
          ./packaging/windows/build-msi.ps1 -Version 0.0.1 -Exe dist/windows_amd64/sliqtly-server.exe
          ./packaging/windows/build-msi.ps1 -Version 0.0.2 -Exe dist/windows_amd64/sliqtly-server.exe
      - name: Install, use, upgrade and remove
        run: ./packaging/windows/smoke-test.ps1 -Msi dist/sliqtly-server_0.0.1_windows_amd64.msi -Upgrade dist/sliqtly-server_0.0.2_windows_amd64.msi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-msi
          path: |
            mcp-go/dist/*.msi
            mcp-go/*.log
            C:/ProgramData/Sliqtly/log/
          retention-days: 3
