# Sliqtly's numbers: visitors, signed-in users and shares for the last days
# (ops/stats.mjs), shown in the run's summary. Run by hand:
# Actions → Stats → Run workflow. Counts only, no names or emails.
#
# The FIREBASE_SERVICE_ACCOUNT secret's account needs Cloud Datastore User
# (reads Firestore) and, for the users table, Firebase Authentication Viewer;
# a table it cannot read says so.
name: Stats

on:
  workflow_dispatch:
    inputs:
      days:
        description: Days back
        default: "30"

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Numbers
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DAYS: ${{ inputs.days }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" node stats.mjs "$DAYS" | tee -a "$GITHUB_STEP_SUMMARY"
