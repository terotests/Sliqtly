name: Probe Nysse (temporary)
on:
  push:
    branches: [claude/project-thread-raepc3]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://data.itsfactory.fi/journeys/api/1
          echo "== allstops"; curl -s -m 30 "$B/stop-points" | wc -c
          echo "== journeys ex"; curl -s -m 30 "$B/journeys?stopPointId=0015&exclude-fields=calls" | head -c 1500; echo
          echo "== journeys ex size"; curl -s -m 30 "$B/journeys?stopPointId=0015&exclude-fields=calls" | wc -c
          echo "== journeys full size"; curl -s -m 30 "$B/journeys?stopPointId=0015" | wc -c
          echo "== tram stop"; curl -s -m 30 "$B/stop-points?name=Hervannan%20kampus" | head -c 800; echo
