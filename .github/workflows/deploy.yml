# Builds and checks the editor (web/dist), then deploys the public viewer
# (web/dist-view, scripts/build-view.mjs) to Firebase Hosting, project
# `sliqtly` (.firebaserc). The viewer reads /api/view/{id} from the MCP
# server, so a change to that answer goes out with Deploy MCP (Go) first.
# Ranger is cloned by the build from
# presentation.config.json.
#
# One-time setting (Settings → Secrets and variables → Actions):
#   secret FIREBASE_SERVICE_ACCOUNT  the JSON key of a service account
#                                    with the "Firebase Hosting Admin" role
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The Ranger compiler needs more than the 2 GB heap Node gets by default
    # on a private repository's runner (7 GB of memory).
    env:
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v4
      - name: Git access to RangerFlow, RangerMarkdown and RangerPPTX
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: sh scripts/ci-git-auth.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # esbuild, which shrinks the compiled bundles (scripts/build.mjs)
      - run: npm ci --no-audit --no-fund
      - name: Build the page
        run: node scripts/build.mjs
      - name: Check the deck and the timeline
        run: node scripts/check.mjs
      # Every sample deck, English and Finnish, opened in Chrome from the
      # built page: no 404 (a chart's data/ file, a font) and no console error.
      - name: Check the sample decks load cleanly
        run: node scripts/check-samples.mjs
      # The public site is the viewer's build (firebase.json "public"): the
      # front page and /s/{id} painted from the server's display lists, no
      # editor and no engine. Opened in Chrome like the samples above.
      - name: Build and check the public viewer
        run: node scripts/build-view.mjs && node scripts/check-view.mjs
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: sliqtly
          channelId: live
      # The Firestore rules (firestore.rules) and the Storage rules
      # (storage.rules), each on its own so one missing role does not hold the
      # other back. The service account needs the roles "Firebase Rules
      # Admin" (both) and "Firebase Storage Admin" (Storage's default bucket).
      # The page is already live when these run; a failure fails the run, so
      # rules that did not go out are seen rather than left as they were.
      - name: Firestore rules
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx --yes firebase-tools@13 deploy --only firestore:rules --project sliqtly --non-interactive \
            || { echo "::error title=Firestore rules not deployed::give the service account the role Firebase Rules Admin"; exit 1; }
      - name: Storage rules
        if: ${{ !cancelled() }}
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx --yes firebase-tools@13 deploy --only storage --project sliqtly --non-interactive \
            || { echo "::error title=Storage rules not deployed::give the service account the roles Firebase Rules Admin and Firebase Storage Admin"; exit 1; }
      # Firestore's TTL policies (firestore.indexes.json): documents whose
      # `expires` has passed are deleted (MCP decks made without sign-in, the
      # MCP server's daily counters and sign-in records). Needs the role Cloud
      # Datastore Index Admin on the service account.
      - name: Firestore TTL policies
        if: ${{ !cancelled() }}
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx --yes firebase-tools@13 deploy --only firestore:indexes --project sliqtly --non-interactive
      # The Storage bucket's CORS (storage.cors.json): a shared deck reads its
      # pictures and data files with fetch(), which the browser refuses
      # without it. Needs the role Storage Admin on the service account.
      - name: Storage CORS
        if: ${{ !cancelled() }}
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json"
          gcloud storage buckets update gs://sliqtly.firebasestorage.app --cors-file=storage.cors.json --project sliqtly
