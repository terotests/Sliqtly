# Warden's Android app (android/warden): the home display in a WebView that
# keeps the screen on while charging and is the tablet's screensaver. Builds
# the APK; on main it is kept as the release "warden-android-latest", which
# the display page and the Warden page link to (mcp-go/wardendisplay.go).
name: Warden Android

on:
  push:
    branches: [main]
    paths: ["android/warden/**", ".github/workflows/warden-android.yml"]
  pull_request:
    paths: ["android/warden/**", ".github/workflows/warden-android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warden-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK
        working-directory: android/warden
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Warden-apk
          path: android/warden/app/build/outputs/apk/release/*.apk
      - name: Publish the APK (release "warden-android-latest")
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/warden/app/build/outputs/apk/release/app-release.apk Warden.apk
          gh release view warden-android-latest >/dev/null 2>&1 || \
            gh release create warden-android-latest --prerelease --title "Warden Android (latest main)" \
              --notes "Warden's home display for an Android tablet. Built by CI from main."
          gh release upload warden-android-latest Warden.apk --clobber
          gh release edit warden-android-latest --notes "Warden's home display for an Android tablet. Built by CI from main ${GITHUB_SHA::7}. Install: open on the tablet and allow installing from the browser."
