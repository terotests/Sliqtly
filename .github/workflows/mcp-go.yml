# Tests the Go build of the MCP server (mcp-go/: Ranger compiled to Go, with
# the editor's deck model from src/, and the Go host around it), and that the
# container builds. Deploys nothing.
name: MCP Go

on:
  pull_request:
    paths: ["mcp-go/**", "src/**", "themes/**", "scripts/lib.mjs", "presentation.config.json", "mcp/guide.md", "mcp/src/preview.html", ".dockerignore", ".github/workflows/mcp-go.yml"]
  push:
    branches: [main]
    paths: ["mcp-go/**", "src/**", "themes/**", "scripts/lib.mjs", "presentation.config.json", "mcp/guide.md", "mcp/src/preview.html", ".dockerignore", ".github/workflows/mcp-go.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp-go/go.mod
          cache-dependency-path: mcp-go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # copies the guide and preview from mcp/, compiles rgr/ and src/ with Ranger
      - run: go generate ./...
      - run: test -z "$(gofmt -l host.go net.go main.go firebase.go server_test.go)"
      # the generated code carries json tags on unexported fields, and the
      # deck model has a few self-assignments
      - run: go vet -structtag=false -assign=false ./...
      - run: go test -race ./...
      - run: docker build -f mcp-go/Dockerfile -t sliqtly-mcp-go .
        working-directory: .
