# Checks the python-pptx layer (python/) on CPython: its tests and the
# example deck. The same files run unchanged on rpy (RangerPython's
# interpreter); see python/README.md.
name: Python

on:
  pull_request:
    paths: ["python/**", ".github/workflows/python.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python python/tests/test_pptx.py
        env:
          PYTHONPATH: python
      - run: python python/examples/q3_review.py "$RUNNER_TEMP/deck" && test -s "$RUNNER_TEMP/deck/q3-review.md"
        env:
          PYTHONPATH: python
