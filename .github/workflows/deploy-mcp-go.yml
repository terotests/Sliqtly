# Deploys the MCP server in Go (mcp-go/) as the Cloud Run service
# `sliqtly-mcp` (europe-west1) in project `sliqtly`. sliqtly.com's /mcp,
# /oauth/**, OAuth /.well-known documents and /api/hit are rewritten to it
# (firebase.json). Run by hand: Actions → Deploy MCP (Go) → Run workflow.
#
# The FIREBASE_SERVICE_ACCOUNT secret's account needs, besides what Deploy MCP
# needs: Artifact Registry Administrator (the first run creates the `mcp`
# repository) and Cloud Run Admin. The service runs as the project's default
# compute account, which needs Cloud Datastore User and Storage Object Admin.
name: Deploy MCP (Go)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mcp-go
  cancel-in-progress: false

env:
  PROJECT: sliqtly
  REGION: europe-west1
  IMAGE: europe-west1-docker.pkg.dev/sliqtly/mcp/sliqtly-mcp-go

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Git access to RangerFlow, RangerMarkdown and RangerPPTX
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: sh scripts/ci-git-auth.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp-go/go.mod
          cache-dependency-path: mcp-go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go generate ./... && go test ./...
        working-directory: mcp-go
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the image
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          gcloud artifacts repositories describe mcp --location "$REGION" --project "$PROJECT" >/dev/null 2>&1 \
            || gcloud artifacts repositories create mcp --repository-format docker --location "$REGION" --project "$PROJECT"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --secret id=deps_token,env=DEPS_TOKEN -f mcp-go/Dockerfile -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Deploy the service
        env:
          # optional: private repositories for read_github_pr,
          # for the Sliqtly user ids in SLIQTLY_GITHUB_USERS (mcp-go/README.md)
          GH_TOKEN_SECRET: ${{ secrets.SLIQTLY_GITHUB_TOKEN }}
          GH_USERS_SECRET: ${{ secrets.SLIQTLY_GITHUB_USERS }}
          # the owner's dashboard, sliqtly.com/main/admin (mcp-go/admin.go):
          # the Google accounts let in, and the Cloud Billing export's
          # BigQuery table (project.dataset.table; unset: no costs shown)
          ADMIN_EMAILS: ${{ vars.SLIQTLY_ADMIN_EMAILS || 'teroktolonen@gmail.com' }}
          BILLING_TABLE: ${{ vars.SLIQTLY_BILLING_TABLE }}
          # sliqtly_plugin's plugins (mcp-go/rgr/Plugins.rgr); unset:
          # code-review, "none" turns them all off
          PLUGINS: ${{ vars.SLIQTLY_PLUGINS || 'code-review' }}
        run: |
          # GOMEMLIMIT: the Go heap kept under 400 MB of the 512 MB. Cloud
          # Run's sandbox need not show the cgroup limit memlimit.go reads,
          # and a heap left to grow to twice its live data was killed by
          # the kernel under a burst of layouts: the client saw 502.
          # --concurrency 8: a create or update lays the whole deck out and
          # renders its report (seconds of CPU and tens of MB each); more
          # at once on one CPU only queue and pile up memory, while a new
          # instance (up to 10) takes them.
          # The pairs are joined by "|" (gcloud's ^|^): an e-mail address has
          # an @, and a list of them commas.
          ENV_VARS="GOMEMLIMIT=400MiB|SLIQTLY_ADMIN_EMAILS=$ADMIN_EMAILS|SLIQTLY_BILLING_TABLE=$BILLING_TABLE|SLIQTLY_PLUGINS=$PLUGINS"
          if [ -n "$GH_TOKEN_SECRET" ]; then
            ENV_VARS="$ENV_VARS|SLIQTLY_GITHUB_TOKEN=$GH_TOKEN_SECRET|SLIQTLY_GITHUB_USERS=$GH_USERS_SECRET"
          fi
          ENV_ARGS=(--update-env-vars "^|^$ENV_VARS")
          gcloud run deploy sliqtly-mcp --image "$IMAGE:$GITHUB_SHA" \
            --region "$REGION" --project "$PROJECT" --allow-unauthenticated \
            --cpu 1 --memory 512Mi --concurrency 8 --max-instances 10 --cpu-boost "${ENV_ARGS[@]}"
          URL=$(gcloud run services describe sliqtly-mcp --region "$REGION" --project "$PROJECT" --format 'value(status.url)')
          echo "Service: $URL/mcp" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the service answers
        run: |
          URL=$(gcloud run services describe sliqtly-mcp --region "$REGION" --project "$PROJECT" --format 'value(status.url)')
          H=(-H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -H 'mcp-protocol-version: 2025-06-18')
          curl -fsS "${H[@]}" "$URL/mcp" -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"deploy","version":"1"}}}' | grep -q '"serverInfo"'
          TOOLS=$(curl -fsS "${H[@]}" "$URL/mcp" -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | grep -o '"name":"[a-z_]*"' | sort -u | tr '\n' ' ')
          echo "Tools: $TOOLS" | tee -a "$GITHUB_STEP_SUMMARY"
          for t in sliqtly_guide create_presentation update_presentation get_presentation bind_chart_data list_files read_file write_workbook list_presentations render_slide render_overview list_comments add_comment resolve_comment begin_work end_work read_github_pr; do
            echo "$TOOLS" | grep -q "\"$t\"" || { echo "missing $t"; exit 1; }
          done
          curl -fsS "$URL/.well-known/oauth-authorization-server" | grep -q '"token_endpoint"'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$URL/api/hit" -H 'content-type: application/json' -d '{"p":"editor"}')" = 204
          # the dashboard answers no one without a listed account's sign-in
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$URL/main/admin/api/stats")" = 401
          # the editor (mcp-go/editor.go): its sign-in page to anyone, its
          # files to no one without a sign-in
          curl -fsS "$URL/editor/" | grep -q 'Sign in to the editor'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$URL/editor/main.js")" = 401
          # shared rooms and their chat (mcp-go/editorrooms.go): there, but
          # nothing without a sign-in, nothing to another site's page
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$URL/editor/api/rooms/list_rooms" -H 'Sec-Fetch-Site: same-origin' -H 'content-type: application/json' -d '{}')" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$URL/editor/api/rooms/list_rooms" -H 'Origin: https://example.com' -H 'content-type: application/json' -d '{}')" = 403
