# Warden's deal watcher (mcp-go/wardenwatch.go): once a day the server looks
# for offers of the entries that are watched. The call runs a batch of the
# watches that are due and says whether more are; it is made again while
# they are. Run by hand: Actions → Warden watch → Run workflow.
#
# It signs in with a Google ID token of the FIREBASE_SERVICE_ACCOUNT
# secret's account, the one Deploy MCP Go deploys as and names to the
# service (WARDEN_CRON_SA): no secret of its own.
name: Warden watch

on:
  schedule:
    - cron: "15 5 * * *" # 07:15 or 08:15 in Helsinki
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run the watches that are due
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          URL: https://sliqtly.com/apps/warden/api/run_watches
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file "$RUNNER_TEMP/sa.json" --quiet
          TOKEN=$(gcloud auth print-identity-token --audiences "$URL")
          rm -f "$RUNNER_TEMP/sa.json"
          for i in 1 2 3 4 5 6 7 8; do
            OUT=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" "$URL")
            echo "$OUT" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "$OUT" | grep -q '"more":true' || break
          done
