name: Probe viewer timing (temporary)
on:
  push:
    branches: [claude/probe-view-timing]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Show the bad bytes in a view
        run: |
          curl -sS -o /tmp/v.json "https://sliqtly.com/api/view/LGXZ6WIgX6"
          python3 - <<'PY'
          b = open("/tmp/v.json", "rb").read()
          bad = []
          i = 0
          while i < len(b):
              try:
                  b[i:].decode("utf-8"); break
              except UnicodeDecodeError as e:
                  p = i + e.start
                  bad.append(p)
                  i = p + 1
          print(len(bad), "bad positions", bad[:20])
          for p in bad[:6]:
              s = b[max(0, p - 160):p + 60]
              print("@", p, s.hex(" "))
              print(repr(s.decode("utf-8", "replace")))
          PY
