[package]
name = "sliqtly-sqlite-bench"
version = "0.1.0"
edition = "2021"
description = "Semantic workload benchmark: SliqtlyDB engines against SQLite"
publish = false

[dependencies]
sliqtly-store = { path = "../sliqtly-store" }
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v7", "serde"] }
