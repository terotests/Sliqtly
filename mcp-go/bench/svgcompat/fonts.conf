<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Chromium sees only the editor's faces, as the preview does
     (svgraster.go): every family, serif and monospace included, is Open
     Sans, so a difference in text is the renderer's, not the font's. -->
<fontconfig>
  <dir prefix="relative">../../fonts</dir>
  <dir prefix="relative">../../symbols</dir>
  <match target="pattern">
    <edit name="family" mode="assign" binding="strong"><string>Open Sans</string></edit>
  </match>
  <cachedir>/tmp/svgcompat-fontcache</cachedir>
</fontconfig>
