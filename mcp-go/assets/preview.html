<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sliqtly</title>
<style>
  :root { color-scheme: light dark; --fg: #1d2233; --muted: #667; --bg: #f6f7fb; --accent: #4b5bdc; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e8ecff; --muted: #9aa3c7; --bg: #0b1030; --accent: #8fa0ff; } }
  html, body { margin: 0; background: transparent; color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #0b1030; border-radius: 10px; overflow: hidden; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .wait { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: #9aa3c7; }
  .wait button.link { color: #8fa0ff; }
  .bar { display: flex; gap: 12px; align-items: center; padding: 8px 2px 2px; flex-wrap: wrap; }
  .title { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); }
  a, button.link { color: var(--accent); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: none; }
  a:hover, button.link:hover { text-decoration: underline; }
  .dl { position: relative; }
  .menu { position: absolute; right: 0; bottom: calc(100% + 6px); display: flex; flex-direction: column; min-width: 150px; padding: 4px; border-radius: 8px; background: var(--bg); box-shadow: 0 4px 16px rgba(0, 0, 0, .25); z-index: 2; }
  .menu[hidden] { display: none; }
  .menu button { text-align: left; padding: 6px 10px; border-radius: 6px; }
  .menu button:hover { background: rgba(127, 127, 127, .15); text-decoration: none; }
</style>
</head>
<body>
<div class="stage"><div class="wait" id="wait">Making the presentation…</div></div>
<div class="bar" id="bar" hidden>
  <span class="title" id="title"></span>
  <span class="meta" id="meta"></span>
  <button class="link" id="open">Open ↗</button>
  <span class="dl"><button class="link" id="download" aria-haspopup="menu" aria-expanded="false">Download ▾</button>
    <span class="menu" id="formats" role="menu" hidden>
      <button class="link" role="menuitem" data-format="pdf">PDF</button>
      <button class="link" role="menuitem" data-format="pptx">PowerPoint (.pptx)</button>
      <button class="link" role="menuitem" data-format="docx">Word (.docx)</button>
      <button class="link" role="menuitem" data-format="html">Web page (.html)</button>
    </span></span>
</div>
<script>
(() => {
  let deck = null;
  let nextId = 1;
  const pending = new Map();
  const mcpApps = !window.openai;

  function send(msg) { window.parent.postMessage(msg, "*"); }
  function request(method, params) {
    const id = nextId++;
    send({ jsonrpc: "2.0", id, method, params });
    return new Promise((ok) => pending.set(id, ok));
  }
  function notify(method, params) { send({ jsonrpc: "2.0", method, params }); }

  function openLink(url) {
    if (window.openai && window.openai.openExternal) window.openai.openExternal({ href: url });
    else if (mcpApps) request("ui/open-link", { url });
    else window.open(url, "_blank", "noopener");
  }
  // the viewer's ⋯ menu (web/main.js): srcdoc is this page's origin, and
  // the sandbox lets only the host open a tab
  window.__sliqtlyOpenLink = openLink;

  function reportSize() {
    if (!mcpApps) return;
    const r = document.documentElement.getBoundingClientRect();
    notify("ui/notifications/size-changed", { width: Math.ceil(r.width), height: Math.ceil(r.height) });
  }

  // The slides are Sliqtly's own viewer. Claude does not let a widget frame
  // another site (nor, it turns out, a blob: URL), so the viewer's page is
  // fetched and given to an iframe as srcdoc, which needs no navigation.
  // The link's #share=… / #md=… goes in <meta name="sliqtly-link">
  // (web/main.js). Where the page cannot be fetched, ChatGPT frames the
  // link itself.
  // Claude's widget CSP also ignores resourceDomains: scripts may run only
  // inline or from blob:/data: URLs, pictures from data:/blob:, while
  // fetch() reaches the connectDomains. So every script the viewer runs is
  // fetched and handed over inline or as a data: URL — the modules through
  // an import map, their imports rewritten to absolute URLs — and
  // Firebase's scripts through window.__sliqtlyLoadScript (web/sliqtly.js).
  // ChatGPT's CSP is the other way round: no data: scripts, the
  // resourceDomains allowed. Which kind of script URL runs here is tried
  // first (scriptKind): data:, else blob:, else the modules straight from
  // the site.
  let page = null;
  const enc = (bytes) => {
    let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  };
  const dataUrl = (type, bytes) => "data:" + type + ";base64," + enc(bytes);
  // whether a classic script at this URL runs in this page (the viewer's
  // frame has the same CSP: an srcdoc inherits it)
  function runs(url) {
    return new Promise((ok) => {
      const s = document.createElement("script");
      s.onload = () => { s.remove(); ok(true); };
      s.onerror = () => { s.remove(); ok(false); };
      s.src = url;
      document.head.append(s);
    });
  }
  let kind = null;
  async function scriptKind() {
    if (await runs("data:text/javascript,0")) return "data";
    try {
      const u = URL.createObjectURL(new Blob(["0"], { type: "text/javascript" }));
      if (await runs(u)) return "blob";
    } catch (_) { /* no blob: here */ }
    return "site";
  }
  // a script's text as a URL of the kind that runs here
  const scriptUrl = (text) => kind === "blob"
    ? URL.createObjectURL(new Blob([text], { type: "text/javascript" }))
    : dataUrl("text/javascript", new TextEncoder().encode(text));
  async function get(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(new URL(url).pathname + ": HTTP " + r.status);
    return r;
  }
  // a module and what it imports, depth first: abs URL → data: URL (the
  // frame may not load the widget's blob: URLs when its origin is opaque)
  async function modules(url, map) {
    if (map.has(url)) return;
    map.set(url, null);
    const deps = [];
    const text = (await (await get(url)).text()).replace(/(\b(?:from|import)\s*\(?\s*)(["'])(\.{1,2}\/[^"']+)\2/g, (_, pre, q, rel) => {
      const abs = new URL(rel, url).href;
      deps.push(abs);
      return pre + q + abs + q;
    });
    for (const d of deps) await modules(d, map);
    map.set(url, scriptUrl(text));
  }
  // A module worker, whole in one data: URL: a worker takes no import map,
  // so its imports are data: URLs too, and its import.meta.url is its URL
  // on the site (what it fetches beside itself, cerxes.wasm, comes from
  // there).
  async function workerModule(url) {
    let text = await (await get(url)).text();
    const re = /(\b(?:from|import)\s*\(?\s*)(["'])(\.{1,2}\/[^"']+)\2/g;
    const inlined = new Map();
    for (const m of text.matchAll(re)) {
      const abs = new URL(m[3], url).href;
      if (!inlined.has(abs)) inlined.set(abs, await workerModule(abs));
    }
    text = text.replace(re, (_, pre, q, rel) => pre + q + inlined.get(new URL(rel, url).href) + q);
    text = text.split("import.meta.url").join(JSON.stringify(url));
    return scriptUrl(text);
  }
  // the workers the viewer may start (web/sitescript.js workerUrl), made
  // only when the build has them
  const WORKERS = ["cerxes-worker.js"];
  async function build(origin) {
    kind ??= await scriptKind();
    let html = await (await get(origin + "/index.html")).text();
    const base = origin + "/";
    const map = new Map();
    const classic = new Map();
    const workers = {};
    const tag = /<script\b([^>]*)\ssrc="([^"]+)"([^>]*)><\/script>/g;
    for (const m of html.matchAll(tag)) {
      const abs = new URL(m[2], base).href;
      if (/type="module"/.test(m[1] + m[3])) {
        // from the site, the modules find what is beside them themselves
        // (a worker from the site does not start here: programs show
        // their plates)
        if (kind === "site") continue;
        await modules(abs, map);
        // with the page's own build stamp (?v=…), as the modules have it
        const stamp = new URL(abs).search;
        for (const w of WORKERS) if (!(w in workers)) {
          try { workers[w] = await workerModule(base + w + stamp); } catch (_) { /* no programs here */ }
        }
      }
      // a classic script runs inline; "</script" inside it is only ever in
      // a string or a regex, where "<\/script" means the same
      else classic.set(abs, (await (await get(abs)).text()).replace(/<\/script/gi, "<\\/script"));
    }
    html = html.replace(tag, (all, a, src, b) => {
      const abs = new URL(src, base).href;
      return classic.has(abs) ? "<script" + a + b + ">" + classic.get(abs) + "<\/script>"
        : "<script" + a + ' src="' + (map.get(abs) || abs) + '"' + b + "><\/script>";
    });
    for (const m of html.matchAll(/<img\b[^>]*\ssrc="([^"]+)"/g)) {
      const abs = new URL(m[1], base).href;
      try {
        const r = await get(abs);
        const url = dataUrl(r.headers.get("content-type") || "image/svg+xml", new Uint8Array(await r.arrayBuffer()));
        html = html.split('src="' + m[1] + '"').join('src="' + url + '"');
      } catch (_) { /* a picture fewer */ }
    }
    // <base> is refused (base-uri 'self'), and the preloads and icon would
    // resolve against about:srcdoc
    html = html.replace(/<base\b[^>]*>/i, "").replace(/<link\b[^>]*>/gi, "");
    const imports = Object.fromEntries([...map].filter(([, v]) => v));
    return { html, importmap: JSON.stringify({ imports }), workers };
  }
  function loader(origin, firebaseConfig, workers) {
    // runs in the viewer. Claude's CSP has base-uri 'self', so no <base>:
    // the page's relative fetches go to the site instead
    const site = origin + "/";
    const fetch0 = window.fetch.bind(window);
    window.fetch = (input, init) => fetch0(typeof input === "string" && !/^[a-z][a-z0-9+.-]*:/i.test(input) ? new URL(input, site).href : input, init);
    // the workers the preview made beforehand (web/sitescript.js): a page
    // whose origin is not the site's may start none from the site
    window.__sliqtlyWorkerUrl = (name) => workers[name] || "";
    // Firebase's <script src> run inline; the project's config comes
    // with the tool result, since Hosting's /__/firebase/init.js may not be
    // readable cross-origin
    window.__sliqtlyLoadScript = (src) => /\/__\/firebase\/init\.js$/.test(src) && firebaseConfig
      ? Promise.resolve().then(() => { if (!firebase.apps.length) firebase.initializeApp(firebaseConfig); })
      : window.fetch(src).then((r) => {
      if (!r.ok) throw new Error("could not load " + src);
      return r.text();
    }).then((t) => {
      const s = document.createElement("script");
      s.textContent = t;
      document.head.append(s);
    });
  }
  async function viewerPage(shareUrl, firebaseConfig) {
    const u = new URL(shareUrl);
    const id = /^\/s\/([A-Za-z0-9]{6,32})\/?$/.exec(u.pathname);
    // a share, or a link that carries the Markdown itself (#md=…)
    const hash = id ? "#share=" + id[1] : /[#&]md=/.test(u.hash) ? u.hash : null;
    if (!hash) throw new Error("not a presentation link");
    page ??= build(u.origin);
    let built;
    try { built = await page; } catch (e) { page = null; throw e; }
    const attr = (v) => v.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    // first in the page: what the host's CSP refuses it, and its errors,
    // for the note in trouble()
    const watch = "<script>window.__trouble=[];addEventListener('securitypolicyviolation',function(e){__trouble.push(e.effectiveDirective+' '+e.blockedURI)});addEventListener('error',function(e){__trouble.push(e.message||(e.target&&(e.target.src||e.target.href))||'error')},true);(" + loader + ")(" + JSON.stringify(u.origin) + "," + JSON.stringify(firebaseConfig || null).replace(/</g, "\\u003c") + "," + JSON.stringify(built.workers) + ")<\/script>";
    const head = watch + '<script type="importmap">' + built.importmap.replace(/</g, "\\u003c") + "<\/script>" +
      '<meta name="sliqtly-link" content="' + attr(hash) + '" />';
    return built.html.replace(/<head>/i, "<head>" + head);
  }

  let shown = 0;
  function trouble(frame, n) {
    // the viewer is the widget's own origin: say where it stopped when it
    // has not started, since the stage alone looks like an empty slide
    setTimeout(() => {
      if (n !== shown) return;
      let where = "";
      try {
        const w = frame.contentWindow;
        if (w.__pageStarted) return;
        const err = w.document.getElementById("err");
        const seen = [...new Set(w.__trouble || [])].slice(0, 4).join("; ");
        where = [seen, err && err.textContent.trim()].filter(Boolean).join(" | ") || "viewer did not start";
      } catch (e) { return; /* not ours to look at */ }
      fail(document.querySelector(".stage"), "The preview could not load here (" + where.slice(0, 400) + ").");
    }, 25000);
  }
  // in place of the stage: what went wrong, and the way out
  function fail(stage, text) {
    const note = document.createElement("div");
    note.className = "wait";
    note.append(text + " ");
    const b = document.createElement("button");
    b.className = "link";
    b.textContent = "Open the presentation ↗";
    b.onclick = () => deck && openLink(deck.share_url);
    note.append(b);
    stage.replaceChildren(note);
  }

  async function show(out, meta) {
    if (!out || !out.share_url || (deck && JSON.stringify(deck) === JSON.stringify(out))) return;
    deck = out;
    const n = ++shown;
    document.getElementById("title").textContent = out.title || "";
    document.getElementById("meta").textContent = out.slides ? out.slides + " slides" : "";
    document.getElementById("bar").hidden = false;
    reportSize();
    let src = out.share_url;
    let local = false;
    let why = "";
    let doc = null;
    // a private deck: the viewer here is signed in to nobody, so it shows
    // the deck carried in the link (preview_url: text, theme and CSS)
    try { doc = await viewerPage(out.preview_url || out.share_url, meta && meta["sliqtly/firebase"]); local = true; } catch (e) { why = String((e && e.message) || e); console.warn("Sliqtly preview: framing the link", e); }
    if (n !== shown) return;
    const stage = document.querySelector(".stage");
    // Claude frames no other site, so there the link is no way out
    if (!local && mcpApps) return fail(stage, "The preview could not load the viewer (" + why + ").");
    // the name while the viewer loads; the viewer then opens on Sliqtly's
    // logo and name (web/index.html)
    stage.innerHTML = '<div class="wait">Sliqtly</div>';
    const frame = document.createElement("iframe");
    if (local) frame.srcdoc = doc;
    else frame.src = src;
    frame.title = out.title || "Presentation";
    frame.allow = "fullscreen; clipboard-write";
    frame.allowFullscreen = true;
    stage.append(frame);
    if (local) trouble(frame, n);
  }

  document.getElementById("open").onclick = () => deck && openLink(deck.share_url);
  // Download: export_presentation called from here (the host lets the
  // widget call its server's tools), then the file's link opened
  async function callTool(name, args) {
    const r = window.openai && window.openai.callTool
      ? await window.openai.callTool(name, args)
      : await request("tools/call", { name, arguments: args });
    if (r && r.error) throw new Error(r.error.message || "the export failed");
    const res = r || {};
    if (res.isError) throw new Error(((res.content || [])[0] || {}).text || "the export failed");
    return res.structuredContent || {};
  }
  // the viewer's own download of a shared deck (web/viewlink.js
  // exportUrl, mcp-go View.rgr ViewExport): pdf and pptx
  function viewerExport(format) {
    if (format !== "pdf" && format !== "pptx") return "";
    try {
      const u = new URL(deck.share_url);
      const id = /^\/s\/([A-Za-z0-9]{6,32})\/?$/.exec(u.pathname);
      return id ? u.origin + "/api/export/" + id[1] + "/" + format : "";
    } catch (_) { return ""; }
  }
  const dl = document.getElementById("download");
  const formats = document.getElementById("formats");
  const label = dl.textContent;
  dl.onclick = () => {
    formats.hidden = !formats.hidden;
    dl.setAttribute("aria-expanded", String(!formats.hidden));
  };
  for (const b of formats.querySelectorAll("button")) b.onclick = async () => {
    formats.hidden = true;
    dl.setAttribute("aria-expanded", "false");
    if (!deck || !deck.deck_id) return;
    dl.disabled = true;
    dl.textContent = "Exporting…";
    const format = b.dataset.format;
    dl.title = "";
    try {
      let url = "";
      try {
        const out = await callTool("export_presentation", { deck_id: deck.deck_id, format });
        if (!out.url) throw new Error("no download link came back");
        url = out.url;
      } catch (e) {
        // the host may refuse the call (ChatGPT asks for its own tool list
        // to be refreshed; a deck made without sign-in is the asking
        // conversation's alone): PDF and PowerPoint also come from the
        // viewer's download, for anyone the link shows the deck to
        url = viewerExport(format);
        if (!url) throw e;
        console.warn("Sliqtly preview: export_presentation", e);
      }
      openLink(url);
      dl.textContent = label;
    } catch (e) {
      console.warn("Sliqtly preview: export", e);
      dl.textContent = "Download failed, try again ▾";
      dl.title = String((e && e.message) || e);
    } finally {
      dl.disabled = false;
    }
  };
  document.addEventListener("click", (e) => {
    if (!formats.hidden && !e.target.closest(".dl")) {
      formats.hidden = true;
      dl.setAttribute("aria-expanded", "false");
    }
  });

  // ChatGPT gives window.openai and is also an MCP Apps host, which may not
  // count the app as open before ui/initialize: both are spoken
  if (window.openai) {
    show(window.openai.toolOutput, window.openai.toolResponseMetadata);
    window.addEventListener("openai:set_globals", (e) => show((e.detail && e.detail.globals && e.detail.globals.toolOutput) || window.openai.toolOutput, window.openai.toolResponseMetadata));
  }

  window.addEventListener("message", (e) => {
    const m = e.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id != null && pending.has(m.id) && !m.method) {
      pending.get(m.id)(m.error ? { error: m.error } : m.result);
      pending.delete(m.id);
      return;
    }
    if (m.method === "ui/notifications/tool-result") show(m.params && m.params.structuredContent, m.params && m.params._meta);
    else if (m.method && m.id != null) send({ jsonrpc: "2.0", id: m.id, result: {} });
  });

  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "sliqtly-preview", version: "1.0.0" },
    appCapabilities: {},
  }).then(() => { notify("ui/notifications/initialized", {}); reportSize(); });
  new ResizeObserver(reportSize).observe(document.documentElement);
})();
</script>
</body>
</html>
