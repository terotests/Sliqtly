# Keeps Formula/sliqtly.rb on the newest Sliqtly Personal: reads the
# latest.json that terotests/Sliqtly's Personal package workflow uploads and
# commits the formula when the version changed.
name: Update the formula

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the formula
        run: |
          curl -fsSL 'https://firebasestorage.googleapis.com/v0/b/sliqtly.firebasestorage.app/o/downloads%2Fpersonal%2Flatest.json?alt=media' \
            | python3 .github/scripts/formula.py > /tmp/sliqtly.rb
          mkdir -p Formula
          if cmp -s /tmp/sliqtly.rb Formula/sliqtly.rb; then echo "up to date"; exit 0; fi
          mv /tmp/sliqtly.rb Formula/sliqtly.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sliqtly.rb
          git commit -m "sliqtly $(grep -m1 '^  version' Formula/sliqtly.rb | cut -d'"' -f2)"
          git push
