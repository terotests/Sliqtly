<html lang="fi">
<head>
<meta charset="utf-8" />

<style>
  html, body { margin: 0; padding: 0; background: #f6f3ef; }
  /* One canvas drawn by EVG; the a11y mirror lies over it. */
  #stage { position: relative; width: 100%; }
  #stage canvas { display: block; outline: none; }
  #file { display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="0"></canvas></div>
<input id="file" type="file" accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values" />
